about:
  en: >-
    I am a master's student in the School of Computer Science at **Peking University**.
    My research interests include **LLM post-training**, **agentic reinforcement learning**, and **data synthesis**.
    I am currently a research intern at **UniPat AI** and previously interned at **ByteDance** and **Baidu**.
    My long-term goal is to advance AI from assisting humans to autonomously solving problems.
  zh-Hans: >-
    我在**北京大学**计算机学院攻读硕士学位，研究兴趣包括**大语言模型后训练**、**智能体强化学习**与**数据合成**。我目前在 **UniPat AI** 实习，此前曾在**字节跳动**和**百度**实习。我的长期目标是推动 AI 从辅助人类走向自主解决问题。

