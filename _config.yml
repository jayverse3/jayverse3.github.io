# Personal website. GitHub Pages publishes master / (root).
locale: "en-US"
site_theme: "default"
title: "Yingjie Yang"
title_separator: "-"
name: "Yingjie Yang"
description: "Yingjie Yang, a master's student at Peking University. Research interests: LLM post-training, agentic reinforcement learning, and data synthesis."
url: "https://jayverse3.github.io"
baseurl: ""
repository: "jayverse3/jayverse3.github.io"

author:
  avatar: "hachiware.jpg"
  name: "Yingjie Yang"
  bio: "M.S. student in Computer Science.<br>Working on LLM post-training."
  location: "Beijing, China"
  employer: "Peking University"
  email: "thejayverse3@gmail.com"
  googlescholar: "https://scholar.google.com/citations?user=F_VWpx4AAAAJ"
  github: "jayverse3"

include:
  - _pages
  - files

exclude:
  # Blog is not published yet. Remove this entry when real posts are ready.
  - _posts
  # Development files and dependencies never belong in the published site.
  - local
  - vendor
  - node_modules
  - .bundle
  - .github
  - .sass-cache
  - .jekyll-cache
  - .jekyll-metadata
  - AGENTS.md
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - scripts
  - assets/js/src
  # Keep asset provenance in Git, but do not publish it as web content.
  - "images/*-source.md"

encoding: "utf-8"
markdown: kramdown
highlighter: rouge
timezone: Etc/UTC

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

sass:
  sass_dir: _sass
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from

whitelist:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from

compress_html:
  clippings: all
  ignore:
    envs: development
