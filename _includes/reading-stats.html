{%- assign stats = include.html | reading_stats -%}
<span class="blog-word-count">{{ include.ui.blog_word_count | replace: '%count%', stats.word_count | escape }}</span>
<span class="blog-meta-separator" aria-hidden="true">|</span>
<span class="blog-reading-time">{{ include.ui.blog_reading_time | replace: '%minutes%', stats.minutes | escape }}</span>
