---
layout: default
---

<div id="main" role="main">
  {% include sidebar.html %}

  <div class="archive cv-page">
    <header class="cv-page__header">
      <h1 class="page__title">{{ page.title }}</h1>
      {% if page.pdf %}
        <a class="cv-page__download" href="{{ page.pdf | relative_url }}" download aria-label="Download CV as PDF (English)">
          <i class="fas fa-download" aria-hidden="true"></i>
          <span>Download PDF</span>
        </a>
      {% endif %}
    </header>
    {{ content }}
  </div>
</div>
