{% include base_path %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% include seo.html %}
    <script>
      (function () {
        var theme;
        try { theme = localStorage.getItem('theme'); } catch (error) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="{{ '/images/favicon.svg' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/terminal/terminal.css' | relative_url }}">
  </head>
  <body class="terminal-page">
    <div class="terminal-app" id="terminal-app" data-home="{{ '/' | relative_url }}" data-cv="{{ '/cv/' | relative_url }}" data-pdf="{{ '/files/yingjie-yang-cv.pdf' | relative_url }}" data-email="{{ site.author.email | escape }}" data-github="https://github.com/{{ site.author.github | escape }}" data-scholar="{{ site.author.googlescholar | escape }}">
      <a class="terminal-skip" href="{{ '/' | relative_url }}">Return to the GUI homepage</a>
      <main class="terminal-workspace" aria-label="Yingjie Yang's terminal homepage">
        <h1 class="sr-only">Yingjie Yang — Terminal</h1>
        <div class="terminal-output" id="terminal-output" aria-label="Interactive terminal"></div>
        <p class="terminal-startup" id="terminal-state" role="status">Starting terminal…</p>
      </main>
      <noscript><p>This terminal needs JavaScript. You can browse the <a href="{{ '/' | relative_url }}">regular homepage</a> instead.</p></noscript>
    </div>
    {% assign homepage = site.pages | where: 'url', '/' | first %}
    <template id="terminal-content">{{ homepage.content | markdownify }}</template>
    <script type="module" src="{{ '/assets/terminal/terminal.js' | relative_url }}"></script>
  </body>
</html>
